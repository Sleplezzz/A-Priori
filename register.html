<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>A Priori - Register</title>
    </head>
    <body>
        <main class="register-container">
            <div class="register-card">
                <!-- Enlace Volver -->
                <a href="index.html" class="back-link">&larr; Volver</a>
                
                <!-- Encabezado -->
                <header class="register-header">
                    <h1>Regístrate</h1>
                    <p>Ya tienes una cuenta? <a href="login.html">Inicia Sesión</a></p>
                </header>
            
                <!-- Formulario Principal -->
                <form class="register-form">
                
                    <!-- Campo Nombre Completo (Nuevo) -->
                    <div class="form-group">
                        <label for="fullname">Nombre Completo</label>
                        <input 
                            type="text" 
                            id="fullname" 
                            name="fullname" 
                            placeholder="Ingresa tu nombre completo" 
                            required 
                        />
                    </div>
                
                    <!-- Campo Correo Electrónico -->
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Ingresa tu correo electrónico" 
                            required 
                            />
                    </div>

                    <!-- Campo Contraseña con el icono -->
                    <div class="form-group password-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Ingresa tu contraseña" 
                            required 
                            />
                            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                            </button>
                        </div>
                    </div>
                
                    <!-- Botón Submit -->
                    <button type="submit" class="btn-primary">Crear Cuenta</button>
                
                </form>
            
                <!-- Separador 'O' -->
                <div class="divider">
                    <span>O</span>
                </div>
            
                <!-- Botón de Google -->
                <button type="button" class="btn-google">
                    <img src="assets/images/logo_google.png" alt="Google Logo" />
                    <span>Iniciar Sesión con Google</span>
                </button>
            
            </div>
        </main>
    </body>
</html>
