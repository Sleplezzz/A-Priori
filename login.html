<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>A Priori - Login</title>
                <link rel="icon" type="image/png" href="assets/images/logo.png">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="assets/styles/styles.css">
        <link rel="stylesheet" href="assets/styles/login.css">
    </head>
    <body>
        <main class="login-container">
            <div class="login-card">
            
                <!-- Enlace Volver -->
                <a href="index.html" class="back-link">Volver</a>

                <!-- Encabezado -->
                <header class="login-header">
                    <h1>Iniciar Sesión</h1>
                    <p>No tienes una cuenta? <a href="register.html">Crear una cuenta</a></p>
                </header>

                <!-- Formulario Principal -->
                <form class="login-form">
                
                    <!-- Campo Correo -->
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="" 
                                required 
                            />
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="form-group password-group">
                        <label for="password">Contraseña</label>
                            <div class="input-wrapper">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    placeholder="" 
                                    required 
                                />
                                <!-- Icono de ocultar/mostrar contraseña -->
                                <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                    </div>

                    <!-- Botón Iniciar Sesión -->
                    <button type="submit" class="btn-primary">Iniciar sesión</button>

                </form>

                <!-- Separador 'O' -->
                <div class="divider">
                    <span>O</span>
                </div>

                <!-- Botón de Google -->
                <button type="button" class="btn-google">
                    <img src="assets/images/logo_google.png" alt="Google Logo" />
                    <span>Acceder con Google</span>
                </button>

                <!-- Ilustración inferior -->
                <div class="cactus-wrapper">
                    <img src="assets/images/planta_login.webp" alt="Ilustración de cactus en maceta" />
                </div>

            </div>
        </main>
        <script src="assets/scripts/login.js"></script>
    </body>
</html>
